name: 🤖 Build NoorTime Android APK

on:
  # Manual trigger — Run karo jab chahiye
  workflow_dispatch:
  # Ya jab main branch pe push ho
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest  # x86-64 machine — ARM issue nahi hoga

    steps:
      # Step 1: Code checkout karo
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Node.js setup
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Java setup (Android build ke liye)
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 4: Android SDK setup
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      # Step 5: Dependencies install
      - name: 📦 Install Dependencies
        run: npm ci

      # Step 6: React production build
      - name: 🏗️ Build React App (Production)
        run: npm run build

      # Step 7: Capacitor sync
      - name: 🔄 Capacitor Sync Android
        run: npx cap sync android

      # Step 8: Make gradlew executable
      - name: 🔑 Make Gradlew Executable
        run: chmod +x android/gradlew

      # Step 9: Build Debug APK
      - name: 🔨 Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      # Step 10: APK upload karo as artifact (Download kar sako)
      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoorTime-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          # 30 din tak available rahega download ke liye
          retention-days: 30

      # Build info print karo
      - name: ✅ Build Complete
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          APK_SIZE=$(du -sh "$APK_PATH" | cut -f1)
          echo "================================"
          echo "✅ NoorTime APK Built Successfully!"
          echo "📦 APK Size: $APK_SIZE"
          echo "📍 Path: $APK_PATH"
          echo "================================"
          echo "Download karo: GitHub Actions → Artifacts"
